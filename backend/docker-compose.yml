services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-flowforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowforge}
      POSTGRES_DB: ${DB_NAME:-flowforge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowforge}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
